<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA en la Industria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e6edf3;
      padding: 24px;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1.4rem;
      color: #58a6ff;
      letter-spacing: 0.5px;
    }
    video {
      width: 100%;
      max-width: 860px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      background: #000;
    }
    p {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .stats-card {
      margin-top: 28px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px 24px;
      max-width: 860px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stats-icon { font-size: 1.4rem; line-height: 1; }
    .stats-info { display: flex; flex-direction: column; gap: 8px; }
    .stats-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6e7681;
    }
    .stats-count {
      font-size: 2rem;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <h2>IA en la Industria</h2>
  <video controls>
    <source src="https://raw.githubusercontent.com/fmansillaib/umayor_class/main/metodos_ia/Clase%201%20y%202/ia_industria.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de video.
  </video>
  <p>Universidad Mayor · Métodos de IA</p>
  <div class="stats-card">
    <span class="stats-icon">👁</span>
    <div class="stats-info">
      <span class="stats-label">Visitas a esta página</span>
      <span class="stats-count" id="visit-count">—</span>
    </div>
  </div>
<script>
  fetch('https://api.countapi.xyz/hit/umayor-class/ia-industria')
    .then(r => r.json())
    .then(d => { document.getElementById('visit-count').textContent = d.value.toLocaleString('es-CL'); })
    .catch(() => {});
</script>
</body>
</html>
